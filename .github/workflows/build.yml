name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Fails on a UI string without a Ukrainian or Russian translation, or on hand-edited .strings files.
      - name: Check translations
        run: python3 scripts/strings.py && git diff --exit-code Resources/

      # No certificate on the runner, so build.sh signs the app ad-hoc.
      - name: Build
        run: ./build.sh

      - name: Show architectures and signature
        run: |
          lipo -info build/SmoothDisplay.app/Contents/MacOS/SmoothDisplay
          codesign --verify --verbose build/SmoothDisplay.app

      - name: Zip app
        run: ditto -c -k --keepParent build/SmoothDisplay.app build/SmoothDisplay.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmoothDisplay-${{ github.sha }}
          path: build/SmoothDisplay.zip
          if-no-files-found: error
